name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  miniapp:
    name: Mini App — typecheck, build, security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (asserts no inline scripts; SRI-friendly bundle)
        run: npm run build
      - name: Unit + security tests (§11.1 canary, §11.4 reveal, §11.5 compat, generator, export)
        run: npm test
      - name: Dependency vulnerability audit (non-blocking)
        run: npm audit || true

  server:
    name: Server — initData tamper + account-event tests (§11.3, §6.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest
      - name: initData + account-event notification tests
        run: pytest tests/security/ -q

  bot:
    name: Bot — menu/command setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt pytest pytest-asyncio
      - name: Bot UI configuration tests
        run: pytest tests/bot/ -q

  csp-audit:
    name: CSP / SRI audit (§11.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert no unsafe-inline and SRI present
        run: node tests/security/csp-audit.mjs

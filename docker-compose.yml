# Securitica Vault — M0 infrastructure (BRIEF §4, §10).
#
#   docker compose up -d
#
# Services:
#   db              PostgreSQL for Vaultwarden
#   vaultwarden     Bitwarden-compatible backend (signups closed)
#   miniapp-server  thin backend: Mini App static, initData verification,
#                   account auto-provisioning (BRIEF §1)
#   bot             aiogram launcher + notifications (allowlist)
#   caddy           TLS edge + authoritative CSP/HSTS
#
# Secrets (BOT_TOKEN, DB password, ADMIN_TOKEN) come from a .env file that is
# NOT committed. See .env.example.
#
# VW_ADMIN_TOKEN is now REQUIRED (not optional): miniapp-server uses it to
# programmatically invite new Telegram users into Vaultwarden (BRIEF §1 — the
# Mini App creates the account directly, no admin panel, no email field, no
# KDF choice). See server/vaultwarden_admin.py.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultwarden
      POSTGRES_USER: vaultwarden
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultwarden"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  vaultwarden:
    image: vaultwarden/server:1.32.7-alpine
    restart: unless-stopped
    env_file:
      - infra/vaultwarden.env
    environment:
      DATABASE_URL: postgresql://vaultwarden:${DB_PASSWORD}@db:5432/vaultwarden
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN:?set VW_ADMIN_TOKEN in .env — required for account auto-provisioning}
    volumes:
      - vw-data:/data
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  miniapp-server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # Public origins only — no secrets baked into the bundle.
        VITE_SERVER_URL: ""
        VITE_VAULTWARDEN_URL: "/vault"
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      INITDATA_TTL_SECONDS: "86400"
      # Optional (BRIEF §6.2 "IP/гео из локальной GeoLite2"): mount a
      # GeoLite2-City.mmdb and set GEOIP_DB_PATH to enable geo in alerts.
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
      # Account auto-provisioning (BRIEF §1): reaches Vaultwarden's admin API
      # directly over the internal network (never through Caddy) to invite
      # new Telegram users. This is a NEW privileged secret held by this
      # service — it has no access to vault contents (Vaultwarden's admin
      # panel never decrypts user data), but it can create/manage accounts.
      VAULTWARDEN_INTERNAL_URL: "http://vaultwarden:80"
      VAULTWARDEN_ADMIN_TOKEN: ${VW_ADMIN_TOKEN:?set VW_ADMIN_TOKEN in .env — required for account auto-provisioning}
      PROVISIONING_DB_PATH: /data/provisioning.sqlite3
    volumes:
      - provisioning-data:/data
    # egress needed: M4 account-event alerts call the Telegram Bot API
    # directly (api.telegram.org), same token already used for initData HMAC.
    networks: [internal, egress]

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      MINIAPP_URL: ${MINIAPP_URL:-https://vault.example.com/}
      ALLOWLIST_CHAT_IDS: ${ALLOWLIST_CHAT_IDS:-}
    networks: [internal, egress]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - vaultwarden
      - miniapp-server
    networks: [internal, egress]

volumes:
  db-data:
  vw-data:
  caddy-data:
  caddy-config:
  provisioning-data:

networks:
  # internal has no direct internet route; egress is for services that must
  # reach Telegram / ACME.
  internal:
    internal: true
  egress:
